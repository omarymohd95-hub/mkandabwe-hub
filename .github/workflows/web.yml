name: Build and deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project and add our code
        run: |
          flutter create --platforms=web --project-name mkandabwe_hub /tmp/app
          cd /tmp/app
          flutter pub add firebase_core cloud_firestore firebase_auth shared_preferences
          cp $GITHUB_WORKSPACE/*.dart lib/
          mkdir -p web/icons
          cp $GITHUB_WORKSPACE/Icon-*.png web/icons/
          cp $GITHUB_WORKSPACE/favicon.png web/favicon.png
          cp $GITHUB_WORKSPACE/manifest.json web/manifest.json
          sed -i 's/mkandabwe_hub/Mkandabwe Hub/g' web/index.html

      - name: Build web
        working-directory: /tmp/app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
